<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gauntlet — THE SKY</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:#e8eef4;-webkit-font-smoothing:antialiased}
  canvas{display:block;position:fixed;inset:0}
  .hud{position:fixed;z-index:5;pointer-events:none}
  .hud.on{pointer-events:auto}
  #tag{top:0;left:0;padding:14px 18px;text-shadow:0 1px 12px rgba(0,0,0,.75)}
  #tag b{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.72;font-weight:600}
  #tag i{display:block;font-style:normal;font-size:19px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
  #tag s{display:block;text-decoration:none;font-size:11.5px;opacity:.6;margin-top:3px}
  #perf{top:0;right:0;padding:14px 18px;text-align:right;font-variant-numeric:tabular-nums;
    text-shadow:0 1px 12px rgba(0,0,0,.75)}
  #perf b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1}
  #perf s{display:block;text-decoration:none;font-size:11px;opacity:.62;margin-top:3px}
  #perf.bad b{color:#ff9c7a}

  #panel{bottom:0;left:0;padding:14px;max-height:calc(100vh - 90px);overflow:auto;
    width:296px;box-sizing:border-box}
  .card{background:rgba(9,13,18,.74);backdrop-filter:blur(22px) saturate(1.5);
    -webkit-backdrop-filter:blur(22px) saturate(1.5);
    border:1px solid rgba(255,255,255,.11);border-radius:13px;padding:12px 13px;
    box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .card + .card{margin-top:9px}
  h4{margin:0 0 9px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.5;font-weight:700}
  .seg{display:flex;gap:4px;background:rgba(255,255,255,.06);padding:3px;border-radius:9px}
  .seg button{flex:1;border:0;background:transparent;color:#cfdae6;font:inherit;font-size:11.5px;
    font-weight:600;padding:7px 4px;border-radius:6px;cursor:pointer;transition:.13s}
  .seg button:hover{background:rgba(255,255,255,.08)}
  .seg button.sel{background:#e8eef4;color:#0b1016}
  .seg small{display:block;font-size:8.5px;font-weight:500;opacity:.55;letter-spacing:.04em;margin-top:1px}
  .seg button.sel small{opacity:.5}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chips button{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.04);
    color:#dbe4ec;font:inherit;font-size:10.5px;padding:5px 8px;border-radius:6px;cursor:pointer;transition:.13s}
  .chips button:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.3)}
  .chips button.sel{background:#e8eef4;color:#0b1016;border-color:#e8eef4}
  .row{display:grid;grid-template-columns:74px 1fr 40px;align-items:center;gap:7px;margin:5px 0}
  .row label{font-size:10.5px;opacity:.68;white-space:nowrap}
  .row output{font-size:10px;opacity:.55;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;
    background:rgba(255,255,255,.2);outline:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#e8eef4;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .togs{display:flex;flex-wrap:wrap;gap:4px}
  .togs button{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.04);
    color:#8f9daa;font:inherit;font-size:10px;padding:4px 7px;border-radius:5px;cursor:pointer;transition:.13s}
  .togs button.on{background:rgba(126,200,255,.17);border-color:rgba(126,200,255,.5);color:#cfe8ff}
  .hint{font-size:9.5px;opacity:.42;margin-top:8px;line-height:1.5}
  kbd{font:inherit;font-size:9px;background:rgba(255,255,255,.11);border-radius:3px;padding:1px 4px;
    border:1px solid rgba(255,255,255,.1)}
  .hidden{display:none !important}
  #err{position:fixed;inset:0;z-index:99;background:#140708;color:#ffd9d0;padding:32px;
    font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;overflow:auto}
  #note{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;pointer-events:none;
    background:rgba(9,13,18,.82);border:1px solid rgba(255,255,255,.12);border-radius:8px;
    padding:7px 14px;font-size:11.5px;opacity:0;transition:opacity .25s}
  #note.show{opacity:1}
</style>
</head>
<body>

<div id="tag" class="hud">
  <b>Gauntlet piece</b>
  <i>The sky</i>
  <s id="modeline">Preetham scattering · volumetric cloud deck · AgX</s>
</div>

<div id="perf" class="hud"><b id="fps">–</b><s id="ms">measuring…</s></div>

<div id="panel" class="hud on">
  <div class="card">
    <h4>Comparison</h4>
    <div class="seg" id="modeseg">
      <button data-mode="now">Today<small>flat + fog</small></button>
      <button data-mode="bar">The bar<small>three.js Sky</small></button>
      <button data-mode="mine" class="sel">Mine<small>full stack</small></button>
    </div>
    <div class="hint">
      <kbd>N</kbd>/<kbd>B</kbd>/<kbd>M</kbd> switch · <kbd>\</kbd> split-screen wipe ·
      <kbd>H</kbd> hide all UI · drag to look
    </div>
  </div>

  <div class="card">
    <h4>Presets</h4>
    <div class="chips" id="presets"></div>
  </div>

  <div class="card">
    <h4>Sun &amp; atmosphere</h4>
    <div id="atmo"></div>
  </div>

  <div class="card">
    <h4>Cloud deck</h4>
    <div id="cloudui"></div>
  </div>

  <div class="card">
    <h4>Camera &amp; grade</h4>
    <div id="gradeui"></div>
    <div class="togs" id="togs" style="margin-top:8px"></div>
  </div>
</div>

<div id="note"></div>

<script src="../../vendor/three.min.js"></script>
<script src="../../vendor/Sky.js"></script>
<script>
/* ===========================================================================
   GAUNTLET — THE SKY.   Target: beat threejs.org/examples/webgl_shaders_sky.
   Constraints honoured: three.js r128 from ../../vendor/three.min.js only,
   zero network requests (the one texture is generated in JS at load), and a
   fragment cost that leaves room for a 63k skinned dog and a 33k skinned man.

   VERIFIED PRESENT in the vendored r128 build (checked by evaluating it in
   node and enumerating exports, not by assumption):
     ShaderMaterial, UniformsUtils, BoxGeometry, PlaneGeometry, DataTexture,
     RepeatWrapping, LinearFilter, RGBAFormat, BackSide, NoToneMapping,
     ACESFilmicToneMapping (= the full Stephen-Hill matrix fit, exposure/0.6),
     LinearEncoding, sRGBEncoding, ShaderChunk.tonemapping_fragment,
     ShaderChunk.encodings_fragment, and the built-in `cameraPosition` uniform.
   VERIFIED ABSENT: THREE.Sky — hence vendor/Sky.js, written alongside this.
   =========================================================================== */
(function () {
'use strict';

// ── crash guard ────────────────────────────────────────────────────────────
window.addEventListener('error', function (e) {
  var d = document.getElementById('err');
  if (!d) { d = document.createElement('pre'); d.id = 'err'; document.body.appendChild(d); }
  d.textContent = 'sky.html failed\n\n' + (e.error && e.error.stack || e.message);
});

// The reciprocal optical-depth factor, the JS twin of the GLSL in
// `extinction()`. It lives in one place because the two copies drifting apart
// is exactly the bug that put a hard dark seam on the horizon: the horizon
// path is ~36x the zenith path, and dropping the `- 90 degrees` term silently
// gave the ground a saturated zenith blue for its haze instead of a pale one.
function inverseOptical(dirY) {
  var za = Math.acos(Math.max(0, Math.min(1, dirY)));
  return 1 / (Math.cos(za) + 0.15 * Math.pow(Math.max(93.885 - za * 180 / Math.PI, 1e-3), -1.253));
}

// ── constants shared with the Preetham model (same numbers as vendor/Sky.js) ─
var TOTAL_RAYLEIGH = [5.804542996261093e-6, 1.3562911419845635e-5, 3.0265902468824876e-5];
var MIE_CONST      = [1.8399918514433978e14, 2.7798023919660528e14, 4.0790479543861094e14];
var CUTOFF = 1.6110731556870734, STEEPNESS = 1.5, EE = 1000.0;
var RAY_ZEN = 8.4e3, MIE_ZEN = 1.25e3;

var P = {                       // the whole tunable state, one object
  elev: 15, azim: 143,
  turbidity: 3.0, rayleigh: 1.7, mieCoef: 0.005, mieG: 0.80,
  exposure: 0.50, grade: 0.85, contrast: 0.30,
  coverage: 0.55, cloudDens: 1.25, cloudH: 1.10, cloudScale: 0.55, wind: 0.35,
  sharp: 0.15, erode: 0.55, cirrus: 0.55, shafts: 0.85, cloudShadow: 0.85, haze: 0.45,
  fov: 52, pitch: -2.0, yaw: 121,
  clouds: 1, dither: 1, grain: 1, vignette: 1, ground: 1, animate: 0,
  tonemap: 1                   // 0 linear, 1 AgX, 2 ACES(r128), 3 Hejl, 4 Reinhard
};

// Each preset is a complete look, framing included, so one click is one sky.
var PRESETS = {
  'Working light': { elev:15, azim:143, yaw:121, turbidity:3.0, rayleigh:1.7, mieCoef:.005, mieG:.80,
                     exposure:.50, coverage:.55, cloudDens:1.25, cloudH:1.10, cloudScale:.55,
                     sharp:.15, cirrus:.55, haze:.55, grade:.85, shafts:.85 },
  'Clear noon':    { elev:58, azim:150, yaw:150, turbidity:2.2, rayleigh:1.05, mieCoef:.004, mieG:.80,
                     exposure:.40, coverage:.40, cloudDens:1.30, cloudH:1.60, cloudScale:.75,
                     sharp:.12, cirrus:.35, haze:.40, grade:.60, shafts:.55 },
  'Golden hour':   { elev:5.0, azim:196, yaw:190, turbidity:4.2, rayleigh:2.05, mieCoef:.0058, mieG:.84,
                     exposure:.62, coverage:.55, cloudDens:1.15, cloudH:1.15, cloudScale:.60,
                     sharp:.14, cirrus:.75, haze:.70, grade:1.05, shafts:1.15 },
  'Dawn mist':     { elev:2.2, azim:74, yaw:74, turbidity:5.2, rayleigh:2.7, mieCoef:.0075, mieG:.86,
                     exposure:.74, coverage:.44, cloudDens:.95, cloudH:.80, cloudScale:.50,
                     sharp:.18, cirrus:.50, haze:1.10, grade:1.05, shafts:1.0 },
  'Overcast':      { elev:30, azim:150, yaw:150, turbidity:8.5, rayleigh:1.0, mieCoef:.017, mieG:.78,
                     exposure:.52, coverage:.95, cloudDens:1.9, cloudH:.65, cloudScale:.40,
                     sharp:.34, cirrus:.10, haze:.85, grade:.45, shafts:.10 },
  'Storm front':   { elev:11, azim:214, yaw:196, turbidity:7.0, rayleigh:2.9, mieCoef:.012, mieG:.85,
                     exposure:.58, coverage:.82, cloudDens:1.9, cloudH:.85, cloudScale:.45,
                     sharp:.20, cirrus:.30, haze:.80, grade:1.05, shafts:1.3 },
  'Dusk':          { elev:-2.0, azim:206, yaw:206, turbidity:3.6, rayleigh:2.6, mieCoef:.005, mieG:.82,
                     exposure:.95, coverage:.52, cloudDens:1.05, cloudH:1.25, cloudScale:.55,
                     sharp:.15, cirrus:.70, haze:.60, grade:1.0, shafts:.5 }
};

var MODE = 'mine';      // now | bar | mine
var split = 0;          // 0 = off, else fraction of the screen showing the bar

// ── renderer / scene ───────────────────────────────────────────────────────
var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false,
                                         powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NoToneMapping;      // MY shaders own the whole
renderer.outputEncoding = THREE.LinearEncoding;  // linear→display chain
document.body.appendChild(renderer.domElement);

var scene = new THREE.Scene();
// The drill's own framing: eye at ~1.95 m, fov 52, near/far as condition.js sets them.
var camera = new THREE.PerspectiveCamera(P.fov, innerWidth / innerHeight, 0.12, 260);
camera.position.set(0, 1.95, 0);

// ── the one texture: 256² of white noise, built here, never fetched ────────
// iq's trick — pre-smoothstep the fractional part and offset by half a texel,
// so ONE hardware-bilinear tap is a smooth value-noise sample. All four
// channels interpolate together, so one tap yields four independent noise
// fields: the domain warp costs nothing extra.
function makeNoiseTexture() {
  var N = 256, data = new Uint8Array(N * N * 4), s = 1234567;
  function rnd() { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; }
  for (var i = 0; i < N * N; i++) {
    data[i * 4    ] = rnd() * 255;
    data[i * 4 + 1] = rnd() * 255;
    data[i * 4 + 2] = rnd() * 255;
    data[i * 4 + 3] = rnd() * 255;
  }
  var t = new THREE.DataTexture(data, N, N, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = t.minFilter = THREE.LinearFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}
var noiseTex = makeNoiseTexture();

// ── uniforms, shared by reference between the sky and the ground ───────────
var U = {
  uNoise:      { value: noiseTex },
  uTime:       { value: 0 },
  uRes:        { value: new THREE.Vector2(1, 1) },
  uSunDir:     { value: new THREE.Vector3(0, 1, 0) },
  uBetaR:      { value: new THREE.Vector3() },
  uBetaM:      { value: new THREE.Vector3() },
  uSunE:       { value: 1000 },
  uSunfade:    { value: 1 },
  uMieG:       { value: 0.8 },
  uSunColor:   { value: new THREE.Vector3(1, 1, 1) },  // linear, extinguished
  uFexH:       { value: new THREE.Vector3(1, 1, 1) },  // extinction at dir.y = 0
  uSkyAmb:     { value: new THREE.Vector3(0.3, 0.4, 0.6) },
  uHorizon:    { value: new THREE.Vector3(0.5, 0.6, 0.7) },
  uExposure:   { value: P.exposure },
  uGrade:      { value: P.grade },
  uContrast:   { value: P.contrast },
  uTonemap:    { value: P.tonemap },
  uCoverage:   { value: P.coverage },
  uCloudDens:  { value: P.cloudDens },
  uCloudH:     { value: P.cloudH },
  uCloudScale: { value: P.cloudScale },
  uSharp:      { value: P.sharp },
  uErode:      { value: P.erode },
  uWind:       { value: new THREE.Vector2() },
  uCirrus:     { value: P.cirrus },
  uShafts:     { value: P.shafts },
  uCloudShadow:{ value: P.cloudShadow },
  uHaze:       { value: P.haze },
  uClouds:     { value: 1 },
  uDither:     { value: 1 },
  uGrain:      { value: 1 },
  uVignette:   { value: 1 },
  uSplit:      { value: 0 },     // 0 = off; >0 = fraction of width showing the bar
  uNowSky:     { value: new THREE.Color(0xBFD2E0).convertSRGBToLinear() },
  uGrassA:     { value: new THREE.Color(0x26311A).convertSRGBToLinear() },
  uGrassB:     { value: new THREE.Color(0x374825).convertSRGBToLinear() },
  uGrassTint:  { value: new THREE.Color(0x6F7F63).convertSRGBToLinear() },
  uNowMode:    { value: 0 }
};

// ===========================================================================
// GLSL — one shared block, textually included in both the sky and the ground,
// so the horizon join is computed by literally the same function on both
// sides of it. That is the whole trick behind the seamless horizon.
// ===========================================================================
var COMMON = [
'precision highp float;',
'uniform sampler2D uNoise;',
'uniform float uTime;',
'uniform vec2  uRes;',
'uniform vec3  uSunDir, uBetaR, uBetaM, uSunColor, uSkyAmb, uHorizon, uNowSky;',
'uniform vec3  uGrassA, uGrassB, uGrassTint, uFexH;',
'uniform float uSunE, uSunfade, uMieG;',
'uniform float uExposure, uGrade, uContrast, uTonemap;',
'uniform float uCoverage, uCloudDens, uCloudH, uCloudScale, uCirrus, uSharp, uErode;',
'uniform float uShafts, uCloudShadow, uHaze, uClouds;',
'uniform float uDither, uGrain, uVignette, uSplit, uNowMode;',
'uniform vec2  uWind;',

'const float PI = 3.141592653589793;',
'const float RAY_ZEN = 8.4E3;',
'const float MIE_ZEN = 1.25E3;',
'const float SUN_COS = 0.9999566769464484;',
'const float T3_16PI = 0.05968310365946075;',
'const float ONE_4PI = 0.07957747154594767;',
'const float EARTH_KM = 6371.0;',

// ── noise ─────────────────────────────────────────────────────────────────
// One tap, four independent smooth value-noise fields. Pre-warping the
// fractional part and offsetting half a texel makes hardware bilinear do the
// interpolation; because all four channels interpolate together, a domain
// warp costs nothing on top of the octave it rides along with.
//
// The weight is QUINTIC, not the usual cubic. Cubic smoothstep is only C1:
// its second derivative jumps at every lattice line, and when a cloud's
// coverage threshold slices through that field the kinks show up as hard
// polygonal facets along the cloud edge — very visible here, where the base
// octave spans ~300 px per cell. Quintic is C2 and the facets disappear.
'vec4 nz4(vec2 x){',
'  vec2 p = floor(x), f = fract(x);',
'  f = f*f*f*(f*(f*6.0 - 15.0) + 10.0);',
'  return texture2D(uNoise, (p+f+0.5)*(1.0/256.0));',
'}',
// sin-free hash (Hoskins). `fract(sin(x)*k)` costs a transcendental and is
// called three times per pixel by the dither and the grain; this is cheaper
// and better distributed, which matters when its whole job is to be invisible.
'float hash21(vec2 p){',
'  vec3 p3 = fract(vec3(p.xyx) * 0.1031);',
'  p3 += dot(p3, p3.yzx + 33.33);',
'  return fract((p3.x + p3.y) * p3.z);',
'}',

// Two fbms, not one with a weight. Weighting an octave by zero does NOT skip
// its texture fetch — the GPU evaluates it and multiplies by 0, so a "LOD" of
// that shape costs exactly as much as full detail. Measured on an M5: the
// weighted version ran 24 ms/frame at 1600x1000. These branch instead, and
// the branches are screen-space coherent because `detail` is a function of
// distance, so whole warps take the same path.
'float fbmLo(vec2 p){',                        // 2 taps — shadows, rays, ground
'  vec4 n0 = nz4(p);',
'  p += (n0.yz - 0.5) * 0.85;',
'  return (0.5*n0.x + 0.25*nz4(p*2.03 + 11.7).x) * 1.3333;',
'}',
// `hi` hands back the highest octave this call actually reached. It has
// already been fetched and weighted into f at an amplitude of 3%, where it
// does nothing visible; handed out separately it erodes the cloud silhouette
// for zero extra taps. That is the difference between a cloud edge and a
// scalloped cut-out, and it is otherwise the most expensive thing to add.
'float fbmHi(vec2 p, float detail, out float hi){',   // 2 to 5 taps
'  vec4 n0 = nz4(p);',
'  p += (n0.yz - 0.5) * 0.85;',                // domain warp, free: spare channels
'  float f = 0.5 * n0.x;',
'  hi = n0.x;',
'  p = p*2.03 + 11.7;  float n = nz4(p).x;  f += 0.2500 * n;  hi = n;',
'  if (detail > 0.02) {',
'    p = p*2.01 + 3.1;  n = nz4(p).x;  f += 0.1250 * n * min(detail*3.0, 1.0);  hi = n;',
'    if (detail > 0.34) {',
'      p = p*2.04 + 7.3;  n = nz4(p).x;  f += 0.0625 * n;  hi = n;',
'      if (detail > 0.68) { p = p*2.02 + 5.9;  n = nz4(p).x;  f += 0.0312 * n;  hi = n; }',
'    }',
'  }',
'  return f * 1.0323;',
'}',

// ── Preetham, exactly the model in vendor/Sky.js ──────────────────────────
// The five values three.js computes per-vertex (sun direction, sunE, sunfade,
// betaR, betaM) do not vary across the sky at all — they depend only on the
// sun and the uniforms. They are computed once per frame on the CPU here and
// passed in, which is arithmetically identical and cheaper.
'float rayleighPhase(float c){ return T3_16PI * (1.0 + c*c); }',
'float hgPhase(float c, float g){',
'  float g2 = g*g;',
'  return ONE_4PI * ((1.0-g2) / pow(max(1.0 - 2.0*g*c + g2, 1e-4), 1.5));',
'}',
'vec3 extinction(float dirY){',
'  float za = acos(max(0.0, dirY));',
'  float inv = 1.0 / (cos(za) + 0.15 * pow(max(93.885 - za*180.0/PI, 1e-3), -1.253));',
'  return exp(-(uBetaR*RAY_ZEN*inv + uBetaM*MIE_ZEN*inv));',
'}',
// The in-scattering, given an extinction that the caller already has. Split
// out because the ground always looks along dir.y == 0, where the extinction
// is one constant for the whole frame (uFexH, solved once on the CPU) — that
// drops an acos, a pow and an exp from every ground pixel on screen.
'vec3 scatter(vec3 dir, vec3 Fex, float disc){',
'  float cosTheta = dot(dir, uSunDir);',
'  vec3 bR = uBetaR * rayleighPhase(cosTheta*0.5 + 0.5);',
'  vec3 bM = uBetaM * hgPhase(cosTheta, uMieG);',
'  vec3 sum = uBetaR + uBetaM;',
'  vec3 Lin = pow(max(uSunE * ((bR+bM)/sum) * (1.0-Fex), 0.0), vec3(1.5));',
'  Lin *= mix(vec3(1.0),',
'             pow(max(uSunE * ((bR+bM)/sum) * Fex, 0.0), vec3(0.5)),',
'             clamp(pow(max(1.0 - uSunDir.y, 0.0), 5.0), 0.0, 1.0));',
'  vec3 L0 = vec3(0.1) * Fex;',
'  L0 += (uSunE * 19000.0 * Fex) * smoothstep(SUN_COS, SUN_COS + 0.00002, cosTheta) * disc;',
'  return (Lin + L0) * 0.04 + vec3(0.0, 0.0003, 0.00075);',
'}',
// Full path: the sky above the horizon, which has to solve its own extinction.
'vec3 skyRadiance(vec3 dir, float disc, out vec3 Fex){',
'  Fex = extinction(dir.y);',
'  return scatter(dir, Fex, disc);',
'}',
// Cheap path: everything the ground looks at is at dir.y == 0.
'vec3 skyRadianceH(vec3 dir){ return scatter(dir, uFexH, 0.0); }',

// ── cloud field ───────────────────────────────────────────────────────────
// Ray/shell intersection instead of ray/plane. A flat cloud plane sends t to
// infinity at the horizon and the noise frequency explodes with it; a shell
// at radius EARTH+h tops out at the real horizon distance (~107 km for a
// 900 m base) and compresses the deck the way a real sky does.
'float shellT(vec3 dir, float hKm){',
'  float b = EARTH_KM * dir.y;',
'  return -b + sqrt(b*b + 2.0*EARTH_KM*hKm + hKm*hKm);',
'}',
// The width of this smoothstep IS the difference between a cumulus and a
// smear: wide gives soft lenticular sheets, narrow gives the hard cauliflower
// edge that reads as a real cloud against sky.
'float coverageOf(float f){ return smoothstep(1.0 - uCoverage, 1.0 - uCoverage + uSharp, f); }',
'float cloudDensity(vec2 uv, float detail){ float hi; return coverageOf(fbmHi(uv, detail, hi)); }',
'float cloudDensityLo(vec2 uv){ return coverageOf(fbmLo(uv)); }',
// Erode the silhouette with the top octave: remap so the cores survive and
// only the partial edge retreats, which is what makes a cloud border wispy
// instead of stamped out with a cookie cutter.
'float erode(float d, float hi, float amt){',
'  float k = hi * amt;',
'  return clamp((d - k) / max(1.0 - k, 1e-3), 0.0, 1.0);',
'}',

// Where the ground has to sample the deck to be in its own shadow: project up
// the sun ray to cloud altitude and ask the same field the sky is asking.
'float cloudShadowAt(vec2 xzMetres){',
'  if (uClouds < 0.5 || uCloudShadow < 0.01) return 1.0;',
'  vec2 p = xzMetres*0.001 + (uSunDir.xz / max(uSunDir.y, 0.12)) * uCloudH;',
'  float d = cloudDensityLo(p*uCloudScale + uWind);',
'  return mix(1.0, 0.24, d * uCloudShadow);',
'}',

// The deck. Returns premultiplied colour in .rgb, coverage in .a.
'vec4 cumulus(vec3 dir, vec3 Fex){',
'  if (dir.y <= 0.0015) return vec4(0.0);',
'  float t  = shellT(dir, uCloudH);',
'  vec2  uv = dir.xz * t  * uCloudScale + uWind;',
'  float detail = 1.0 - smoothstep(4.0, 45.0, t);',
'  float hi;',
'  float d = coverageOf(fbmHi(uv, detail, hi));',
'  d = erode(d, hi, uErode * detail);',        // only near clouds: far ones are haze
'  if (d <= 0.002) return vec4(0.0);',

// Self-shadowing: two taps back along the sun, offset by cot(elevation), so a
// low sun rakes right across the deck and a high sun barely shadows it.
'  vec2 sdir = (uSunDir.xz / max(uSunDir.y, 0.14))  * uCloudScale;',
'  float s1 = cloudDensityLo(uv + sdir*0.09);',
'  float s2 = cloudDensityLo(uv + sdir*0.30);',
'  float shadow = exp(-(s1*1.25 + s2*0.85) * uCloudDens * 1.7);',

// Relief. A 2D density field lit by a 2D shadow lookup is a flat sheet; what
// makes cumulus read as lumps is the slope of the top surface facing the sun.
// s1 is already the density one short step sunward, so (d - s1) IS the slope
// along the only axis that matters for N.L — the billows cost nothing extra.
'  float relief = clamp(uSunDir.y*1.35 + (d - s1)*3.4, 0.0, 1.45);',

'  float cosT = dot(dir, uSunDir);',
// Forward lobe = the silver lining; the small back lobe keeps the far side of
// every cloud from going flat grey.
'  float hg = hgPhase(cosT, 0.78)*2.4 + hgPhase(cosT, -0.25)*0.55 + 0.42;',
'  float powder = 1.0 - exp(-uCloudDens * d * 6.0);',    // dark edges facing us

// Scaled by the sun's ACTUAL irradiance. Sunlit cloud tops are the brightest
// thing in a daylight sky short of the disc itself; a cloud darker than the
// sky behind it is the single loudest tell of a fake one.
'  vec3 lit  = uSunColor * uSunE * 0.0115 * shadow * relief * hg * powder;',
'  lit      += uSkyAmb * (0.45 + 0.55*d) * 1.5;',        // sky fill on the bases

'  float a = 1.0 - exp(-uCloudDens * d * 5.5);',
'  a *= exp(-t * uHaze * 0.020);',                       // aerial perspective
'  a *= smoothstep(0.0, 0.030, dir.y);',                 // never show the singularity
'  return vec4(lit * a, a);',
'}',

// A second, much higher, much thinner deck. Three taps, and it is most of what
// separates "a sky" from "a blue gradient with cumulus pasted on".
'vec4 cirrus(vec3 dir, vec3 Fex){',
'  if (dir.y <= 0.004 || uCirrus < 0.01) return vec4(0.0);',
'  float t  = shellT(dir, 7.5);',
'  vec2  uv = dir.xz * t * 0.075 + uWind*0.35;',
'  uv.x *= 0.30;',                                        // stretch into streaks
'  float f = fbmLo(uv) * 0.72 + nz4(uv*3.7 + 21.0).w * 0.28;',
'  float d = smoothstep(0.50, 0.80, f) * uCirrus;',
'  if (d <= 0.002) return vec4(0.0);',
'  float cosT = dot(dir, uSunDir);',
'  float hg = hgPhase(cosT, 0.80)*3.0 + 0.85;',
'  vec3 lit = uSunColor * uSunE * 0.0075 * hg + uSkyAmb * 1.1;',
'  float a = d * 0.55 * exp(-t*uHaze*0.006) * smoothstep(0.004, 0.06, dir.y);',
'  return vec4(lit*a, a);',
'}',

// Crepuscular rays. Six steps from the pixel direction toward the sun,
// measuring how clear the deck is along the way; branched to the ~13% of the
// hemisphere within 44 deg of the sun, so it costs almost nothing on average.
'float lightShaft(vec3 dir){',
'  float cosT = dot(dir, uSunDir);',
'  if (uShafts < 0.01 || uClouds < 0.5 || cosT < 0.72 || uSunDir.y < -0.02) return 0.0;',
'  float acc = 0.0;',
'  for (int i = 1; i <= 4; i++) {',
'    vec3 d = normalize(mix(dir, uSunDir, float(i)/4.0 * 0.88));',
'    if (d.y <= 0.01) { acc += 1.0; continue; }',
'    float t = shellT(d, uCloudH);',
'    acc += 1.0 - cloudDensityLo(d.xz*t*uCloudScale + uWind);',
'  }',
'  acc *= 0.25;',
'  return acc*acc * smoothstep(0.72, 0.998, cosT) * uShafts;',
'}',

// ── tone mapping ──────────────────────────────────────────────────────────
// AgX. Sigmoid in log2 space with a chroma-preserving inset/outset pair: it
// rolls a 500000:1 solar disc down to white without the magenta shift ACES
// puts on bright blue sky, and it holds the gradient near the sun instead of
// clipping it into a flat disc of paper.
'const mat3 AGX_IN = mat3(0.842479062253094, 0.0423282422610123, 0.0423756549057051,',
'                        0.0784335999999992, 0.878468636469772,  0.0784336,',
'                        0.0792237451477643, 0.0791661274605434, 0.879142973793104);',
'const mat3 AGX_OUT = mat3( 1.19687900512017,  -0.0528968517574562, -0.0529716355144438,',
'                          -0.0980208811401368, 1.15190312990417,   -0.0980434501171241,',
'                          -0.0990297440797205,-0.0989611768448433,  1.15107367264116);',
'vec3 agxCurve(vec3 x){',
'  vec3 x2 = x*x, x4 = x2*x2;',
'  return 15.5*x4*x2 - 40.14*x4*x + 31.96*x4 - 6.868*x2*x + 0.4298*x2 + 0.1191*x - 0.00232;',
'}',
// Blender calls this step the "look". Base AgX is deliberately neutral and
// reads as flat grey next to ACES; the punch (a slope, a small gamma and a
// saturation lift, all applied in the log-encoded domain where they behave)
// is what buys back the contrast without buying back the clipping.
'vec3 agxLook(vec3 c){',
'  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));',
'  c = pow(max(c*1.02, vec3(0.0)), vec3(1.16));',        // slope + gamma
'  return l + (c - l) * 1.42;',                          // saturation
'}',
'vec3 tmAgX(vec3 c){',
'  const float mn = -12.47393, mx = 4.026069;',
'  c = AGX_IN * max(c, vec3(0.0));',
'  c = clamp(log2(max(c, vec3(1e-10))), mn, mx);',
'  c = (c - mn) / (mx - mn);',
'  c = clamp(agxCurve(c), 0.0, 1.0);',
'  c = clamp(agxLook(c), 0.0, 1.0);',
'  c = AGX_OUT * c;',
'  return pow(max(c, vec3(0.0)), vec3(2.2));',            // back to linear
'}',
// The bar, byte for byte: this is r128's own ACESFilmicToneMapping.
// NOT named RRTAndODTFit: the moment renderer.toneMapping leaves NoToneMapping
// (which bar mode does), three injects tonemapping_pars_fragment — including
// its own RRTAndODTFit — into the prefix of EVERY ShaderMaterial, and the
// duplicate body is a hard compile error. Renamed to stay out of its way.
'vec3 acesRRTODT(vec3 v){',
'  vec3 a = v*(v + 0.0245786) - 0.000090537;',
'  vec3 b = v*(0.983729*v + 0.4329510) + 0.238081;',
'  return a/b;',
'}',
'vec3 tmACES(vec3 c){',
'  const mat3 IN  = mat3(0.59719, 0.07600, 0.02840,  0.35458, 0.90834, 0.13383,  0.04823, 0.01566, 0.83777);',
'  const mat3 OUT = mat3(1.60475,-0.10208,-0.00327, -0.53108, 1.10813,-0.07276, -0.07367,-0.00605, 1.07602);',
'  c = c / 0.6;',
'  c = IN * c; c = acesRRTODT(c); c = OUT * c;',
'  return clamp(c, 0.0, 1.0);',
'}',
'vec3 tmHejl(vec3 c){',
'  c = max(vec3(0.0), c - 0.004);',
'  c = (c*(6.2*c + 0.5)) / (c*(6.2*c + 1.7) + 0.06);',
'  return pow(c, vec3(2.2));',                            // undo its baked gamma
'}',
'vec3 tmReinhard(vec3 c){',
'  float l = dot(c, vec3(0.2126,0.7152,0.0722));',
'  return c / (1.0 + l);',
'}',
'vec3 tonemap(vec3 c){',
'  if (uTonemap < 0.5) return clamp(c, 0.0, 1.0);',
'  if (uTonemap < 1.5) return tmAgX(c);',
'  if (uTonemap < 2.5) return tmACES(c);',
'  if (uTonemap < 3.5) return tmHejl(c);',
'  return tmReinhard(c);',
'}',
'vec3 toSRGB(vec3 c){',
'  c = max(c, vec3(0.0));',
'  return mix(c*12.92, 1.055*pow(c, vec3(1.0/2.4)) - 0.055, step(vec3(0.0031308), c));',
'}',
// A grade, applied in display space where a grade belongs: cool the shadows,
// warm the highlights, and put a gentle S through the middle. This is the
// cheapest half of the Red Dead look and it costs eight instructions.
'vec3 grade(vec3 c){',
'  float l = dot(c, vec3(0.2126,0.7152,0.0722));',
'  vec3 t = mix(vec3(0.945,0.985,1.075), vec3(1.055,1.005,0.930), smoothstep(0.10,0.74,l));',
'  c = mix(c, c*t, uGrade);',
'  c = mix(c, c*c*(3.0-2.0*c), uContrast*uGrade);',
'  return c;',
'}',
// TPDF dither. A sky is one enormous smooth gradient and 8-bit output bands it
// into visible rings; +-1/255 of triangular noise removes them completely and
// is the single cheapest realism win on this whole page.
'vec3 finish(vec3 linear, vec2 frag){',
'  vec3 c = tonemap(linear * uExposure);',
'  c = toSRGB(c);',
'  c = grade(c);',
'  if (uVignette > 0.5) {',
'    vec2 q = frag/uRes - 0.5; q.x *= uRes.x/uRes.y;',
'    c *= 1.0 - 0.20*smoothstep(0.34, 0.92, length(q));',
'  }',
'  if (uGrain > 0.5) {',
'    float g = hash21(frag + fract(uTime)*137.0) - 0.5;',
'    c += g * 0.011 * (0.35 + 0.65*(1.0 - dot(c, vec3(0.33))));',
'  }',
'  if (uDither > 0.5) {',
'    float r1 = hash21(frag + 0.17), r2 = hash21(frag + 7.31);',
'    c += (r1 - r2) / 255.0;',
'  }',
'  return c;',
'}'
].join('\n');

// ===========================================================================
// SKY
// ===========================================================================
var skyMat = new THREE.ShaderMaterial({
  uniforms: U,
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  vertexShader: [
    'varying vec3 vWorld;',
    'void main(){',
    '  vec4 wp = modelMatrix * vec4(position, 1.0);',
    '  vWorld = wp.xyz;',
    '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
    '  gl_Position.z = gl_Position.w;',   // pin to the far plane: works at any camera.far
    '}'
  ].join('\n'),
  fragmentShader: COMMON + [
    'varying vec3 vWorld;',
    'void main(){',
    '  vec3 dir = normalize(vWorld - cameraPosition);',

    // --- "today": flat background colour, nothing else. The floor.
    '  if (uNowMode > 0.5) { gl_FragColor = vec4(toSRGB(uNowSky), 1.0); return; }',

    '  vec3 Fex;',
    '  vec3 L = skyRadiance(dir, 0.0, Fex);',      // disc handled below, prettier
    '  float cosT = dot(dir, uSunDir);',

    // ---- the bar: three.js Sky verbatim (its internal pow, then r128 ACES
    //      at exposure 0.5, then sRGB). Same scattering, so the comparison is
    //      about everything ABOVE the scattering, which is the honest question.
    '  bool isBar = (uSplit > 0.0 && gl_FragCoord.x < uSplit*uRes.x);',
    '  if (isBar) {',
    '    vec3 Ld = L + (uSunE*19000.0*Fex)*smoothstep(SUN_COS, SUN_COS+0.00002, cosT)*0.04;',
    '    vec3 r = pow(max(Ld, 0.0), vec3(1.0/(1.2 + 1.2*uSunfade)));',
    '    gl_FragColor = vec4(toSRGB(tmACES(r*0.5)), 1.0);',
    '    return;',
    '  }',

    // ---- mine.
    // Solar disc, limb-darkened, plus four glare lobes. Preetham's disc is a
    // hard smoothstep that reads as a sticker; real suns have a core that
    // blows to white and a halo that spreads for tens of degrees.
    '  float edge = smoothstep(SUN_COS - 0.000035, SUN_COS + 0.000012, cosT);',
    '  float r2   = clamp((1.0 - cosT) / (1.0 - SUN_COS), 0.0, 1.0);',
    '  float limb = mix(1.0, 0.58, r2*r2);',
    '  vec3  disc = uSunE * 16000.0 * Fex * edge * limb;',

    // Four lobes off ONE base. pow(x,n) is exp2(n*log2(x)); sharing the log2
    // turns 4 transcendental pairs into 1 log2 + 4 exp2.
    '  float ls = log2(max(cosT, 1e-8));',
    '  float glare = exp2(7000.0*ls)*3.2 + exp2(750.0*ls)*0.85',
    '              + exp2(  85.0*ls)*0.16 + exp2(  7.0*ls)*0.020;',

    // Clouds first so their transmittance can eat the disc and the glare —
    // a sun that keeps blazing through a cumulus is the tell of a fake sky.
    '  vec4 cu = vec4(0.0), ci = vec4(0.0);',
    '  if (uClouds > 0.5) { cu = cumulus(dir, Fex); ci = cirrus(dir, Fex); }',
    '  float trans = (1.0 - cu.a) * (1.0 - ci.a);',

    '  L += (disc + uSunColor*glare*uSunE*0.055) * trans;',
    '  L += uSunColor * lightShaft(dir) * 0.34 * uSunE * 0.0016;',   // crepuscular

    // Composite: cirrus is above the cumulus, so cumulus over sky, cirrus over that.
    '  L = L*(1.0 - ci.a) + ci.rgb;',
    '  L = L*(1.0 - cu.a) + cu.rgb;',

    // The horizon band. Real skies never have a clean edge — there is always a
    // few degrees of pale, desaturated aerosol sitting on the join, and it is
    // what tells the eye the ground runs out to a distance.
    '  float band = pow(1.0 - clamp(dir.y, 0.0, 1.0), 9.0);',
    '  L = mix(L, uHorizon, band * 0.16 * uHaze);',

    // Stars, only once the sun is genuinely down.
    '  if (uSunDir.y < 0.03) {',
    '    vec3 sp = dir*300.0; vec3 id = floor(sp); vec3 fr = fract(sp) - 0.5;',
    '    float h = hash21(id.xy + id.z*37.0);',
    '    float st = smoothstep(0.20, 0.02, length(fr)) * step(0.9915, h);',
    '    st *= 0.55 + 0.45*sin(uTime*2.6 + h*221.0);',
    '    L += vec3(st*1.6) * smoothstep(0.03,-0.10,uSunDir.y) * smoothstep(0.0,0.09,dir.y);',
    '  }',

    '  gl_FragColor = vec4(finish(L, gl_FragCoord.xy), 1.0);',
    '}'
  ].join('\n')
});
var skyMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), skyMat);
skyMesh.scale.setScalar(45000);
skyMesh.frustumCulled = false;
// Draw the sky LAST. Both meshes sit at the origin, so three's front-to-back
// opaque sort cannot separate them and may shade the whole screen with the
// expensive sky shader before the ground paints over half of it. Pinning the
// sky behind the ground in the queue lets the depth test reject every sky
// fragment below the horizon before it ever runs — measured below.
skyMesh.renderOrder = 10;
scene.add(skyMesh);

// The vendored three.js Sky itself, so "the bar" can also be shown as the
// literal upstream object rather than my reproduction of it.
var vanillaSky = new THREE.Sky();
vanillaSky.scale.setScalar(45000);
vanillaSky.visible = false;
vanillaSky.frustumCulled = false;
vanillaSky.renderOrder = 10;
scene.add(vanillaSky);

// ===========================================================================
// GROUND — deliberately plain geometry. Its whole job here is to prove the
// horizon join and carry the cloud shadows; the field itself is someone
// else's piece of this gauntlet.
// ===========================================================================
var groundMat = new THREE.ShaderMaterial({
  uniforms: U,
  fog: false,
  vertexShader: [
    'varying vec3 vWorld;',
    'void main(){',
    '  vec4 wp = modelMatrix * vec4(position, 1.0);',
    '  vWorld = wp.xyz;',
    '  gl_Position = projectionMatrix * viewMatrix * wp;',
    '}'
  ].join('\n'),
  fragmentShader: COMMON + [
    'varying vec3 vWorld;',
    'void main(){',
    '  vec3 V = vWorld - cameraPosition;',
    '  float dist = length(V);',
    '  vec3 dir = V/dist;',

    // --- "today": lambert-ish grass under THREE.Fog(skyColour, 26, 74).
    '  if (uNowMode > 0.5) {',
    '    vec3 base = mix(uGrassA, uGrassB, nz4(vWorld.xz*0.09).x);',
    '    float f = clamp((dist - 26.0)/(74.0 - 26.0), 0.0, 1.0);',
    '    gl_FragColor = vec4(toSRGB(mix(base*1.9, uNowSky, f)), 1.0);',
    '    return;',
    '  }',

    '  float detail = 1.0 - smoothstep(18.0, 240.0, dist);',
    '  vec4 n1 = nz4(vWorld.xz*0.055);',
    '  vec4 n2 = nz4(vWorld.xz*0.31);',
    '  float m = n1.x*0.62 + n1.y*0.20 + n2.z*0.18*detail;',
    '  vec3 albedo = mix(uGrassA, uGrassB, m);',
    '  albedo = mix(albedo, uGrassTint, 0.10 + 0.16*n1.w);',

    '  float sh = cloudShadowAt(vWorld.xz);',
    '  float ndl = max(uSunDir.y, 0.0);',
    '  vec3 lit = albedo * (uSunColor*uSunE*0.024*ndl*sh + uSkyAmb*2.4);',

    // Aerial perspective, evaluated with the SAME skyRadiance the sky above
    // uses — so the far ground and the low sky converge on one colour and the
    // horizon has no seam. This also makes the haze swing bright toward the
    // sun's azimuth and cool away from it, which flat THREE.Fog cannot do.
    '  vec3 fogCol = skyRadianceH(normalize(vec3(dir.x, 0.0001, dir.z)));',
    // From a 1.95 m eye, ground at 100 m sits 11 px below the horizon and
    // ground at 1 km sits 1 px below it: past a kilometre the whole rest of
    // the field is compressed into a single row of pixels. So the haze has to
    // do all its work inside ~200 m or the horizon reads as a painted-on line
    // no matter how well the sky above it is solved. This is also why Red Dead
    // leans so hard on near-field aerial perspective.
    '  float f = 1.0 - exp(-pow(dist*0.0042*(0.35 + uHaze), 1.35));',
    '  vec3 L = mix(lit, fogCol, clamp(f, 0.0, 1.0));',

    '  bool isBar = (uSplit > 0.0 && gl_FragCoord.x < uSplit*uRes.x);',
    '  if (isBar) { gl_FragColor = vec4(toSRGB(tmACES(L*0.5)), 1.0); return; }',
    '  gl_FragColor = vec4(finish(L, gl_FragCoord.xy), 1.0);',
    '}'
  ].join('\n')
});
var groundGeo = new THREE.PlaneGeometry(60000, 60000, 1, 1);
groundGeo.rotateX(-Math.PI / 2);
var ground = new THREE.Mesh(groundGeo, groundMat);
ground.frustumCulled = false;
scene.add(ground);

// ===========================================================================
// CPU side of the model — the per-frame sun solve
// ===========================================================================
var sunDir = new THREE.Vector3();

function updateSun() {
  var phi = THREE.MathUtils.degToRad(90 - P.elev);
  var theta = THREE.MathUtils.degToRad(P.azim);
  sunDir.setFromSphericalCoords(1, phi, theta);
  U.uSunDir.value.copy(sunDir);

  // sunE / sunfade / betaR / betaM — the five "varyings" three.js recomputes
  // per vertex, which are in fact constant over the whole dome.
  var zc = Math.max(-1, Math.min(1, sunDir.y));
  var sunE = EE * Math.max(0, 1 - Math.exp(-((CUTOFF - Math.acos(zc)) / STEEPNESS)));
  var sunfade = 1 - Math.min(1, Math.max(0, 1 - Math.exp(sunDir.y / 450000)));
  var rc = P.rayleigh - (1 - sunfade);
  var mie = 0.434 * ((0.2 * P.turbidity) * 10e-18) * P.mieCoef;

  U.uSunE.value = sunE;
  U.uSunfade.value = sunfade;
  U.uMieG.value = P.mieG;
  U.uBetaR.value.set(TOTAL_RAYLEIGH[0]*rc, TOTAL_RAYLEIGH[1]*rc, TOTAL_RAYLEIGH[2]*rc);
  U.uBetaM.value.set(MIE_CONST[0]*mie, MIE_CONST[1]*mie, MIE_CONST[2]*mie);

  // Extinction along the sun ray gives the sun's real colour. This drives the
  // cloud lighting AND the ground's key light, which is the point: the sky is
  // the light source, not a backdrop that happens to sit behind one.
  var inv = inverseOptical(sunDir.y);
  var fx = [0, 0, 0];
  for (var i = 0; i < 3; i++) {
    fx[i] = Math.exp(-(U.uBetaR.value.getComponent(i)*RAY_ZEN*inv +
                       U.uBetaM.value.getComponent(i)*MIE_ZEN*inv));
  }
  var mx = Math.max(fx[0], fx[1], fx[2]) || 1;
  U.uSunColor.value.set(fx[0]/mx, fx[1]/mx, fx[2]/mx);

  // Extinction along the horizon: constant for the whole frame, so every
  // ground pixel can be handed it instead of solving it per pixel.
  var invH = inverseOptical(0);
  U.uFexH.value.set(
    Math.exp(-(U.uBetaR.value.x*RAY_ZEN*invH + U.uBetaM.value.x*MIE_ZEN*invH)),
    Math.exp(-(U.uBetaR.value.y*RAY_ZEN*invH + U.uBetaM.value.y*MIE_ZEN*invH)),
    Math.exp(-(U.uBetaR.value.z*RAY_ZEN*invH + U.uBetaM.value.z*MIE_ZEN*invH))
  );

  // Sky ambient: the model's own zenith radiance, which is exactly what fills
  // a cloud base and a shadow on the ground.
  U.uSkyAmb.value.copy(radianceJS(new THREE.Vector3(0, 1, 0))).multiplyScalar(0.62);
  U.uHorizon.value.copy(radianceJS(new THREE.Vector3(-sunDir.x, 0.0, -sunDir.z).normalize()));

  // Keep the vendored Sky in step so the "bar" button is the real object.
  vanillaSky.material.uniforms.turbidity.value = P.turbidity;
  vanillaSky.material.uniforms.rayleigh.value = P.rayleigh;
  vanillaSky.material.uniforms.mieCoefficient.value = P.mieCoef;
  vanillaSky.material.uniforms.mieDirectionalG.value = P.mieG;
  vanillaSky.material.uniforms.sunPosition.value.copy(sunDir);
}

// The same Preetham evaluation in JS, used for the ambient/horizon probes.
function radianceJS(dir) {
  var inv = inverseOptical(dir.y);
  var cosTheta = dir.dot(sunDir);
  var rPh = 0.05968310365946075 * (1 + cosTheta*cosTheta);
  var g = P.mieG, g2 = g*g;
  var mPh = 0.07957747154594767 * ((1-g2) / Math.pow(Math.max(1 - 2*g*cosTheta + g2, 1e-4), 1.5));
  var out = new THREE.Vector3();
  for (var i = 0; i < 3; i++) {
    var bR = U.uBetaR.value.getComponent(i), bM = U.uBetaM.value.getComponent(i);
    var Fex = Math.exp(-(bR*RAY_ZEN*inv + bM*MIE_ZEN*inv));
    var frac = (bR*rPh + bM*mPh) / (bR + bM);
    var Lin = Math.pow(Math.max(U.uSunE.value * frac * (1 - Fex), 0), 1.5);
    var w = Math.min(1, Math.max(0, Math.pow(Math.max(1 - sunDir.y, 0), 5)));
    Lin *= (1 - w) + w * Math.sqrt(Math.max(U.uSunE.value * frac * Fex, 0));
    out.setComponent(i, (Lin + 0.1*Fex) * 0.04);
  }
  return out;
}

function pushUniforms() {
  U.uExposure.value  = P.exposure;
  U.uGrade.value     = P.grade;
  U.uContrast.value  = P.contrast;
  U.uTonemap.value   = P.tonemap;
  U.uCoverage.value  = P.coverage;
  U.uCloudDens.value = P.cloudDens;
  U.uCloudH.value    = P.cloudH;
  U.uCloudScale.value= P.cloudScale;
  U.uSharp.value     = P.sharp;
  U.uErode.value     = P.erode;
  U.uCirrus.value    = P.cirrus;
  U.uShafts.value    = P.shafts;
  U.uCloudShadow.value = P.cloudShadow;
  U.uHaze.value      = P.haze;
  U.uClouds.value    = P.clouds;
  U.uDither.value    = P.dither;
  U.uGrain.value     = P.grain;
  U.uVignette.value  = P.vignette;
  U.uNowMode.value   = (MODE === 'now') ? 1 : 0;
  ground.visible     = !!P.ground;
  camera.fov = P.fov; camera.updateProjectionMatrix();
}

function applyMode() {
  var barObj = (MODE === 'bar');
  vanillaSky.visible = barObj;
  skyMesh.visible = !barObj;
  // The bar is rendered under the settings the three.js example itself uses.
  renderer.toneMapping = barObj ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
  renderer.toneMappingExposure = 0.5;
  renderer.outputEncoding = barObj ? THREE.sRGBEncoding : THREE.LinearEncoding;
  vanillaSky.material.needsUpdate = true;
  skyMat.needsUpdate = true;
  groundMat.needsUpdate = true;
  U.uNowMode.value = (MODE === 'now') ? 1 : 0;
  // In bar mode the ground still needs a sky-coloured fog to be comparable,
  // so it keeps my aerial perspective but is tone-mapped by the renderer.
  U.uSplit.value = (MODE === 'bar' && !barObj) ? 1 : split;
  document.getElementById('modeline').textContent =
    MODE === 'now' ? 'flat scene.background + linear THREE.Fog — what tab 05 has today'
  : MODE === 'bar' ? 'vendored THREE.Sky (Preetham) · ACES @ 0.5 · sRGB — the bar'
  :                  'Preetham · 2 cloud decks · shafts · aerial perspective · AgX';
  [].forEach.call(document.querySelectorAll('#modeseg button'), function (b) {
    b.classList.toggle('sel', b.dataset.mode === MODE);
  });
}

// ===========================================================================
// look-around (a first-person head, not a turntable — same as the drill)
// ===========================================================================
var dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', function (e) {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointerup', function (e) {
  dragging = false;
  try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (x) {}
});
renderer.domElement.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  P.yaw   -= (e.clientX - lastX) * 0.16;
  P.pitch += (e.clientY - lastY) * 0.11;
  P.pitch = Math.max(-32, Math.min(78, P.pitch));
  lastX = e.clientX; lastY = e.clientY;
});
renderer.domElement.addEventListener('wheel', function (e) {
  e.preventDefault();
  P.fov = Math.max(18, Math.min(88, P.fov + Math.sign(e.deltaY) * 2));
  ui.sync();
}, { passive: false });

function aimCamera() {
  var y = THREE.MathUtils.degToRad(P.yaw), p = THREE.MathUtils.degToRad(P.pitch);
  var d = new THREE.Vector3(Math.sin(y)*Math.cos(p), Math.sin(p), Math.cos(y)*Math.cos(p));
  camera.lookAt(camera.position.clone().add(d));
}

// ===========================================================================
// UI
// ===========================================================================
var ui = (function () {
  var syncs = [];
  function slider(host, key, label, min, max, step, fmt, after) {
    var row = document.createElement('div'); row.className = 'row';
    var l = document.createElement('label'); l.textContent = label;
    var i = document.createElement('input');
    i.type = 'range'; i.min = min; i.max = max; i.step = step; i.value = P[key];
    var o = document.createElement('output');
    function show() { o.textContent = fmt ? fmt(P[key]) : P[key]; }
    i.addEventListener('input', function () {
      P[key] = parseFloat(i.value); show(); if (after) after(); pushUniforms(); updateSun();
    });
    syncs.push(function () { i.value = P[key]; show(); });
    show();
    row.appendChild(l); row.appendChild(i); row.appendChild(o); host.appendChild(row);
  }
  function toggle(host, key, label) {
    var b = document.createElement('button');
    b.textContent = label;
    function paint() { b.classList.toggle('on', !!P[key]); }
    b.addEventListener('click', function () { P[key] = P[key] ? 0 : 1; paint(); pushUniforms(); });
    syncs.push(paint); paint(); host.appendChild(b);
  }
  var n1 = function (v) { return (Math.round(v*10)/10).toString(); };
  var n2 = function (v) { return (Math.round(v*100)/100).toFixed(2); };
  var n0 = function (v) { return Math.round(v).toString(); };

  var atmo = document.getElementById('atmo');
  slider(atmo, 'elev', 'elevation', -6, 88, 0.1, function(v){ return n1(v)+'°'; });
  slider(atmo, 'azim', 'azimuth', 0, 360, 1, function(v){ return n0(v)+'°'; });
  slider(atmo, 'turbidity', 'turbidity', 1, 20, 0.1, n1);
  slider(atmo, 'rayleigh', 'rayleigh', 0, 4, 0.01, n2);
  slider(atmo, 'mieCoef', 'mie', 0, 0.06, 0.0005, function(v){ return v.toFixed(4); });
  slider(atmo, 'mieG', 'mie g', 0, 0.99, 0.01, n2);

  var cu = document.getElementById('cloudui');
  slider(cu, 'coverage', 'coverage', 0, 1, 0.01, n2);
  slider(cu, 'cloudDens', 'density', 0.2, 2.6, 0.01, n2);
  slider(cu, 'cloudH', 'base (km)', 0.35, 3.0, 0.01, n2);
  slider(cu, 'cloudScale', 'cell size', 0.04, 1.2, 0.005, function(v){ return v.toFixed(3); });
  slider(cu, 'sharp', 'edge', 0.03, 0.6, 0.005, function(v){ return v.toFixed(3); });
  slider(cu, 'erode', 'erosion', 0, 0.95, 0.01, n2);
  slider(cu, 'cirrus', 'cirrus', 0, 1, 0.01, n2);
  slider(cu, 'shafts', 'god rays', 0, 1.6, 0.01, n2);
  slider(cu, 'cloudShadow', 'shadows', 0, 1, 0.01, n2);
  slider(cu, 'wind', 'wind', 0, 2, 0.01, n2);

  var gr = document.getElementById('gradeui');
  slider(gr, 'exposure', 'exposure', 0.05, 2.2, 0.01, n2);
  slider(gr, 'grade', 'grade', 0, 1.6, 0.01, n2);
  slider(gr, 'contrast', 'contrast', 0, 0.8, 0.01, n2);
  slider(gr, 'haze', 'haze', 0, 1.4, 0.01, n2);
  slider(gr, 'fov', 'fov', 18, 88, 1, n0);
  slider(gr, 'yaw', 'look (yaw)', 0, 360, 1, function(v){ return n0(v)+'°'; });
  slider(gr, 'pitch', 'look (tilt)', -32, 78, 0.5, function(v){ return n1(v)+'°'; });

  // tonemap chips
  var tmrow = document.createElement('div'); tmrow.className = 'chips';
  tmrow.style.marginTop = '8px';
  ['Linear','AgX','ACES r128','Hejl','Reinhard'].forEach(function (name, idx) {
    var b = document.createElement('button');
    b.textContent = name;
    b.addEventListener('click', function () { P.tonemap = idx; pushUniforms(); paintTm(); });
    tmrow.appendChild(b);
  });
  function paintTm() {
    [].forEach.call(tmrow.children, function (b, i) { b.classList.toggle('sel', i === P.tonemap); });
  }
  syncs.push(paintTm); paintTm();
  gr.appendChild(tmrow);

  var tg = document.getElementById('togs');
  toggle(tg, 'clouds', 'clouds');
  toggle(tg, 'dither', 'dither');
  toggle(tg, 'grain', 'grain');
  toggle(tg, 'vignette', 'vignette');
  toggle(tg, 'ground', 'ground');
  toggle(tg, 'animate', 'sun sweep');

  var ph = document.getElementById('presets');
  Object.keys(PRESETS).forEach(function (name) {
    var b = document.createElement('button');
    b.textContent = name;
    b.addEventListener('click', function () {
      var q = PRESETS[name];
      for (var k in q) if (Object.prototype.hasOwnProperty.call(q, k)) P[k] = q[k];
      [].forEach.call(ph.children, function (c) { c.classList.toggle('sel', c === b); });
      ui.sync(); pushUniforms(); updateSun();
      note(name);
    });
    ph.appendChild(b);
  });
  ph.firstChild.classList.add('sel');

  return { sync: function () { syncs.forEach(function (f) { f(); }); } };
})();

var noteEl = document.getElementById('note'), noteT = 0;
function note(txt) {
  noteEl.textContent = txt; noteEl.classList.add('show');
  clearTimeout(noteT); noteT = setTimeout(function () { noteEl.classList.remove('show'); }, 1300);
}

[].forEach.call(document.querySelectorAll('#modeseg button'), function (b) {
  b.addEventListener('click', function () { MODE = b.dataset.mode; split = 0; applyMode(); pushUniforms(); });
});

addEventListener('keydown', function (e) {
  var k = e.key.toLowerCase();
  if (k === 'h') {
    var hid = document.getElementById('panel').classList.toggle('hidden');
    document.getElementById('tag').classList.toggle('hidden', hid);
    document.getElementById('perf').classList.toggle('hidden', hid);
  } else if (k === 'n') { MODE = 'now'; split = 0; applyMode(); pushUniforms(); }
  else if (k === 'b') { MODE = 'bar'; split = 0; applyMode(); pushUniforms(); }
  else if (k === 'm') { MODE = 'mine'; split = 0; applyMode(); pushUniforms(); }
  else if (k === '\\') {
    MODE = 'mine'; split = split > 0 ? 0 : 0.5; applyMode();
    note(split ? 'split: left = three.js Sky + ACES, right = mine' : 'split off');
  }
});

addEventListener('resize', function () {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  U.uRes.value.set(renderer.domElement.width, renderer.domElement.height);
});

// ===========================================================================
// loop
// ===========================================================================
var clock = new THREE.Clock();
var acc = 0, frames = 0, worst = 0, fpsEl = document.getElementById('fps'),
    msEl = document.getElementById('ms'), perfEl = document.getElementById('perf');

function frame() {
  requestAnimationFrame(frame);
  var dt = Math.min(clock.getDelta(), 0.05);
  U.uTime.value += dt;
  U.uWind.value.x += dt * P.wind * 0.055;
  U.uWind.value.y += dt * P.wind * 0.021;
  if (P.animate) { P.elev = 42 + 44 * Math.sin(U.uTime.value * 0.06); ui.sync(); updateSun(); }
  aimCamera();

  var t0 = performance.now();
  renderer.render(scene, camera);
  var t1 = performance.now();

  acc += dt; frames++; worst = Math.max(worst, dt);
  if (acc > 0.5) {
    var fps = frames / acc;
    fpsEl.textContent = Math.round(fps);
    msEl.textContent = (acc / frames * 1000).toFixed(1) + ' ms avg · ' +
                       (worst * 1000).toFixed(1) + ' ms worst · ' +
                       renderer.domElement.width + '×' + renderer.domElement.height;
    perfEl.classList.toggle('bad', fps < 55);
    acc = 0; frames = 0; worst = 0;
  }
}

U.uRes.value.set(renderer.domElement.width, renderer.domElement.height);
updateSun();
pushUniforms();
applyMode();
frame();

// expose for scripted screenshotting / verification
window.SKY = { P: P, U: U, setMode: function (m) { MODE = m; applyMode(); pushUniforms(); },
               preset: function (n) { var q = PRESETS[n]; for (var k in q) P[k] = q[k];
                                      ui.sync(); pushUniforms(); updateSun(); },
               // set any subset of P and have every derived value re-solve
               apply: function (o) { for (var k in o) P[k] = o[k];
                                     ui.sync(); pushUniforms(); updateSun(); },
               renderer: renderer, camera: camera, scene: scene, sky: skyMesh, ground: ground };
})();
</script>
</body>
</html>
