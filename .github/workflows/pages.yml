# Publish the app to GitHub Pages.
#
# Actions, not the legacy Pages builder: the legacy one fails on this repo with
# a bare "Page build failed" and no log to read.
#
# Deploys here genuinely sit in deployment_in_progress for 10-12 minutes. The
# timeout below is deliberately far past GitHub's 10-minute default, because a
# run that aborts at ten minutes often lands the content anyway and then reports
# red — so never trust the run status. Verify by hashing the live files against
# the local ones.
#
# _work is excluded: it holds the build scripts, the owner's photographs and the
# manual extract. None of that belongs on a public site.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_work' \
                --exclude '.gitignore' --exclude '.gitattributes' ./ _site/
          touch _site/.nojekyll
          ls -la _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
